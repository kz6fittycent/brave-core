# Both function bodies open with a BUILDFLAG(IS_ANDROID) conditional that
# tree-sitter cannot parse, so blank parse-blocking macros before AST matching.
blank_macros_for_ast_parsing: true

substitutions:
  - description: |-
      Let a Brave hook run first in `available()`.

      The hook returns true when it took `callback`, and `Available` then
      returns. Otherwise it maps `kDictation` to `kCommand` and returns false.
      Thus upstream takes its SODA branch, where Brave's policy answers.
      Upstream otherwise refuses `kDictation` before it asks Brave's policy,
      unless `kOnDeviceWebSpeechSmallExpertModel` is enabled. The SODA branch
      also reads the same language names that `install()` records for the
      origin.
    preempt_function_impl:
      function_name: OnDeviceSpeechRecognitionImpl::Available
      return_if: |-
        MaybeHandleBraveOnDeviceSpeechAvailable(
                weak_ptr_factory_.GetWeakPtr(), languages, quality, callback)

  - description: |-
      Let a Brave hook run first in `install()`.

      The hook returns true when it took `callback`, and `Install` then
      returns. For example, it cancels `install()` in Private, Tor and Guest
      profiles, and it asks before upstream can start a download of Brave's
      model. Once the user allows the download, `Install` runs again from the
      top, so every upstream check runs again. Otherwise the hook maps
      `kDictation` to `kCommand` and returns false. Thus upstream takes its
      SODA branch, where `BraveSodaInstaller` installs Brave's model.
      Upstream's other branch, the optimization guide one, asks for a model
      that Brave does not ship.
    preempt_function_impl:
      function_name: OnDeviceSpeechRecognitionImpl::Install
      return_if: |-
        MaybeHandleBraveOnDeviceSpeechInstall(
                CanRenderFrameHostUseOnDeviceSpeechRecognition(),
                weak_ptr_factory_.GetWeakPtr(), languages, quality, callback)
