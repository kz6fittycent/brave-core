substitutions:
  - description: |-
      Expose HorizontalTabStyleViews's private members to BraveVerticalTabStyle.

      Friend access is needed to be able to call certain private methods.
    add_friend:
      class_name: HorizontalTabStyleViews
      friend_type: class BraveVerticalTabStyle

  - description: |-
      Virtualise GetSeparatorBounds for BraveVerticalTabStyle.

      Only the instance overload; the static one shares its name.
    regex:
      pattern:
        'TabStyle::SeparatorBounds GetSeparatorBounds(float scale) const;'
      replace:
        'virtual TabStyle::SeparatorBounds GetSeparatorBounds(float scale)
        const;'

  - description: |-
      Virtualise PaintSeparators for BraveVerticalTabStyle.

      Upstream paints separators through a static overload that computes its
      own bounds, so BraveVerticalTabStyle paints them itself to use its
      separator bounds. Only the instance overload is virtualised.
    regex:
      pattern: 'void PaintSeparators(gfx::Canvas* canvas) const;'
      replace: 'virtual void PaintSeparators(gfx::Canvas* canvas) const;'

  - description: |-
      Virtualise IsHovering for BraveVerticalTabStyle.
    make_virtual:
      class_name: HorizontalTabStyleViews
      method_name: IsHovering

  - description: |-
      Virtualise GetSeparatorOpacity for BraveVerticalTabStyle.

      Virtualising to tweak separator visibility for vertical tabs and split
      tabs.
    make_virtual:
      class_name: HorizontalTabStyleViews
      method_name: GetSeparatorOpacity

  - description: |-
      Virtualise GetCurrentTabBackgroundColor for BraveVerticalTabStyle.

      Virtualising to supply its own vertical-tab background colors.
    make_virtual:
      class_name: HorizontalTabStyleViews
      method_name: GetCurrentTabBackgroundColor
